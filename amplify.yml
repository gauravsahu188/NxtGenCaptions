version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            - node --version
            - npm --version
            - npm ci
        build:
          commands:
            - env | grep -E '^(DATABASE_URL|AUTH_|GOOGLE_|NEXT_PUBLIC_|EMAIL_|GMAIL_|AWS_|REMOTION_|PORT|DEEPGRAM_|HF_|RAZORPAY_)' > .env.production || true
            - npx prisma generate
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
