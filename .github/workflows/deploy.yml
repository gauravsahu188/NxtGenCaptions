name: CI/CD Pipeline - EC2 Deployment

# Trigger deployment on push to main, pull requests (CI check only), or manual trigger
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip Prisma DB Migrations'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force EC2 Deployment'
        required: false
        default: false
        type: boolean

# Cancel obsolete running jobs if newer commits are pushed in the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  npm_config_onnxruntime_node_install_cuda: skip

jobs:
  # =========================================================================
  # JOB 1: CONCURRENT BUILD & TEST - FRONTEND (Next.js 15 + Prisma)
  # Runs concurrently with backend build to minimize total CI/CD pipeline time
  # =========================================================================
  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Caching Next.js build output (.next/cache) dramatically speeds up repeated builds
      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: Generate Frontend Prisma Client
        working-directory: ./frontend
        run: npx --yes prisma@7 generate

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: https://nxtgencaptions.com
          NODE_ENV: production
        run: npm run build

  # =========================================================================
  # JOB 2: CONCURRENT BUILD & TEST - BACKEND (Express + TypeScript + Prisma)
  # Runs concurrently in parallel with frontend build
  # =========================================================================
  build-backend:
    name: Build Backend (Express API)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --prefer-offline --no-audit --onnxruntime-node-install-cuda=skip || npm install --prefer-offline --no-audit --onnxruntime-node-install-cuda=skip

      - name: Generate Backend Prisma Client
        working-directory: ./backend
        run: npx --yes prisma@7 generate

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

  # =========================================================================
  # JOB 3: AUTOMATIC EC2 DEPLOYMENT
  # Executes only after BOTH concurrent builds succeed on the 'main' branch
  # =========================================================================
  deploy-ec2:
    name: Deploy to EC2 (nxtgencaptions.com)
    needs: [build-frontend, build-backend]
    if: |
      always() &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' || inputs.force_deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Announce Deployment Start
        run: |
          echo "🚀 All concurrent builds passed successfully!"
          echo "Connecting to AWS EC2 instance for automatic code update on nxtgencaptions.com..."

      - name: Validate EC2 Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.EC2_HOST }}" ] && MISSING="$MISSING EC2_HOST"
          [ -z "${{ secrets.EC2_USER }}" ] && MISSING="$MISSING EC2_USER"
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && MISSING="$MISSING EC2_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Error: The following required GitHub Secrets are missing or empty:$MISSING"
            echo "Please configure them under: Repository Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          fi
          echo "✅ All required EC2 connection secrets are configured."

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations || false }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          envs: SKIP_MIGRATIONS
          script: |
            bash -l -c '
              set -e

              # 1. Auto-discover application directory
              APP_DIR="${{ secrets.EC2_APP_DIR || '' }}"
              if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
                for candidate in "$HOME/NxtGenCaptions" "$HOME/nxtgencaptions" "/var/www/nxtgencaptions" "$HOME/NxtGen-Captions"; do
                  if [ -d "$candidate" ]; then
                    APP_DIR="$candidate"
                    break
                  fi
                done
              fi

              if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
                echo "❌ Error: Could not locate application directory on EC2. Checked: $HOME/NxtGenCaptions, /var/www/nxtgencaptions"
                exit 1
              fi

              echo "📂 Application directory: $APP_DIR"
              cd "$APP_DIR"

              # 2. Fetch and reset to latest code from main
              echo "🔄 Updating code from origin/main..."
              git fetch origin main
              git reset --hard origin/main

              # 3. Execute zero-downtime deployment script
              echo "⚙️ Executing deployment script ./scripts/deploy-ec2.sh..."
              chmod +x ./scripts/deploy-ec2.sh
              ./scripts/deploy-ec2.sh
            '

      - name: Deployment Success Summary
        if: success()
        run: |
          echo "=================================================="
          echo "🎉 CI/CD Pipeline Completed Successfully!"
          echo "🌐 Live URL: https://nxtgencaptions.com"
          echo "=================================================="
