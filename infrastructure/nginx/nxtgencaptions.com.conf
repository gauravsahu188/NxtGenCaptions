# ==============================================================================
# Nginx Configuration for nxtgencaptions.com
# Place at: /etc/nginx/sites-available/nxtgencaptions.com.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/nxtgencaptions.com.conf /etc/nginx/sites-enabled/
# Test & reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# Upstream definitions
upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream backend_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nxtgencaptions.com www.nxtgencaptions.com api.nxtgencaptions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nxtgencaptions.com www.nxtgencaptions.com api.nxtgencaptions.com;

    # SSL Configuration (Certbot will manage certificate paths)
    # ssl_certificate /etc/letsencrypt/live/nxtgencaptions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nxtgencaptions.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Maximum file upload size (4GB for video files)
    client_max_body_size 4096M;
    client_body_timeout 600s;
    client_header_timeout 600s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Route backend endpoints directly to Express API
    location ~ ^/(api/video|api/render|api/payment|api/webhooks|api/mcp|api/health|uploads) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for large video uploads/streaming
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Next.js Static Files Caching
    location /_next/static {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All other requests route to Next.js Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
